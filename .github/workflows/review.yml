name: review
on:
  workflow_dispatch:
    inputs:
      repo: { description: "owner/name", required: true }
      pr: { description: "PR number", required: true }
      post: { description: "pending | review | inbox | comment", default: "review" }
      model: { description: "model alias", default: "sonnet" }
      budget: { description: "USD cap", default: "3" }
      focus: { description: "focus areas", default: "" }
      effort: { description: "low | medium | high", default: "high" }
      requester: { description: "who asked for the run", default: "" }
      question: { description: "ask only: the question", default: "" }
      task: { description: "review | publish | fix | init-notes | ask | summarize | triage", default: "review" }
      findings: { description: "fix only: 2,3 or all", default: "" }
      via: { description: "fix only: patch | suggest | stacked | push", default: "patch" }
      platform: { description: "linux | macos, for the fix test gate", default: "linux" }
      as: { description: "fix only: commit author, bot | me", default: "bot" }
jobs:
  review:
    runs-on: ${{ inputs.platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    # A newer request for the same PR replaces a running review, but only the review: the lessons job below
    # has its own group and is never cancelled.
    concurrency:
      group: review-${{ inputs.repo }}-${{ inputs.pr }}
      cancel-in-progress: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: rayandrew/rsrobo-notes
          token: ${{ secrets.USER_TOKEN }}
          ref: trunk
          path: notes
      - uses: actions/checkout@v6
        with:
          repository: rayandrew/kb
          token: ${{ secrets.USER_TOKEN }}
          path: kb
      - name: install rkb
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=linux-x86_64 ;;
            Linux-ARM64) asset=linux-aarch64 ;;
            macOS-ARM64) asset=macos-aarch64 ;;
            *) echo "no rkb binary for $RUNNER_OS-$RUNNER_ARCH" && exit 1 ;;
          esac
          gh release download -R rslib/rkb -p "rkb-$asset-*.tar.gz" -O rkb.tar.gz
          tar -xzf rkb.tar.gz && sudo install -m 755 rkb /usr/local/bin/rkb && rkb --version
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm i -g @anthropic-ai/claude-code @earendil-works/pi-coding-agent
      - name: pi extensions and auth
        continue-on-error: true
        run: |
          pi install npm:@tintinweb/pi-subagents
          mkdir -p ~/.pi/agent/extensions
          cp pi/rkb-extension.ts ~/.pi/agent/extensions/rkb.ts
          node scripts/freeinference-models.ts > ~/.pi/agent/models.json || cp pi/models.json ~/.pi/agent/models.json
          if [ -n "$PI_AUTH_JSON" ]; then printf '%s' "$PI_AUTH_JSON" > ~/.pi/agent/auth.json && chmod 600 ~/.pi/agent/auth.json; fi
        env:
          PI_AUTH_JSON: ${{ secrets.PI_AUTH_JSON }}
          FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_API_KEY }}
      - run: |
          if [ "$TASK" = ask ]; then
            node src/cli.ts ask "$REPO" "$QUESTION" --issue "$PR" --post --budget "$BUDGET" ${REQUESTER:+--requester "$REQUESTER"} ${MODEL:+--model "$MODEL"}
          elif [ "$TASK" = summarize ] || [ "$TASK" = triage ]; then
            node src/cli.ts "$TASK" "$REPO" --issue "$PR" --post --budget "$BUDGET" ${REQUESTER:+--requester "$REQUESTER"} ${MODEL:+--model "$MODEL"}
          elif [ "$TASK" = init-notes ]; then
            node src/cli.ts init-notes "$REPO" --notes "$RSROBO_NOTES_DIR" --model "$MODEL" --budget "$BUDGET"
          elif [ "$TASK" = publish ]; then
            node src/cli.ts publish "$REPO#$PR"
          elif [ "$TASK" = fix ]; then
            node src/cli.ts fix "$REPO#$PR" "$FINDINGS" --via "$VIA" --as "$AS" --model "$MODEL" --budget "$BUDGET" --post inbox ${REQUESTER:+--requester "$REQUESTER"}
          else
            node src/cli.ts review "$REPO#$PR" --post "$POST" --model "$MODEL" --budget "$BUDGET" --effort "$EFFORT" ${FOCUS:+--focus "$FOCUS"} ${REQUESTER:+--requester "$REQUESTER"}
          fi
        env:
          TASK: ${{ inputs.task }}
          FINDINGS: ${{ inputs.findings }}
          VIA: ${{ inputs.via }}
          AS: ${{ inputs.as }}
          REPO: ${{ inputs.repo }}
          PR: ${{ inputs.pr }}
          POST: ${{ inputs.post }}
          MODEL: ${{ inputs.model }}
          BUDGET: ${{ inputs.budget }}
          FOCUS: ${{ inputs.focus }}
          EFFORT: ${{ inputs.effort }}
          REQUESTER: ${{ inputs.requester }}
          QUESTION: ${{ inputs.question }}
          GH_TOKEN: ${{ secrets.USER_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREEINFERENCE_API_KEY: ${{ secrets.FREEINFERENCE_API_KEY }}
          RSROBO_NOTES_DIR: ${{ github.workspace }}/notes
          RSROBO_KB_DIR: ${{ github.workspace }}/kb
      - if: inputs.task == 'review'
        uses: actions/upload-artifact@v4
        with:
          name: review-json
          path: .work/*/.rsrobo/review.json
          include-hidden-files: true
          if-no-files-found: ignore
      # What this run wrote into the notes checkout goes to an artifact; the `notes` job below pushes it.
      # This job never pushes, so two runs on different PRs cannot race on the notes repo here.
      - if: always()
        working-directory: notes
        run: git ls-files -o -m --exclude-standard | tar -czf ../notes-changes.tgz -T -
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-changes
          path: notes-changes.tgz
          if-no-files-found: ignore
      - if: failure()
        run: |
          gh issue create -R "$INBOX_REPO" -l rsrobo -t "rsrobo: review failed for $REPO#$PR" \
            -b "Run: $RUN_URL"
        env:
          REPO: ${{ inputs.repo }}
          PR: ${{ inputs.pr }}
          INBOX_REPO: rayandrew/rsrobo-notes
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.USER_TOKEN }}
  # Pushes what the run wrote to the notes repo. One writer at a time across all runs, queued, never cancelled.
  # A push can still lose to a push from outside CI, so it rebases and tries again.
  notes:
    needs: review
    if: always() && needs.review.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    concurrency:
      group: notes-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: rayandrew/rsrobo-notes
          token: ${{ secrets.USER_TOKEN }}
          ref: trunk
          path: notes
      - uses: actions/download-artifact@v4
        id: changes
        continue-on-error: true
        with:
          name: notes-changes
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - working-directory: notes
        run: |
          [ -s ../notes-changes.tgz ] || { echo "nothing to push"; exit 0; }
          tar -xzf ../notes-changes.tgz
          git config user.name rsrobo
          git config user.email rsrobo@users.noreply.github.com
          push_retry() {
            for i in 1 2 3 4 5; do
              git push -q && return 0
              git pull -q --rebase -X theirs || { git rebase --abort; return 1; }
              sleep $((i * 3))
            done
            return 1
          }
          git add -A
          if ! git diff --cached --quiet; then git commit -qm "rsrobo: $TASK $REPO#$PR" && push_retry; fi
          # The ledger is derived from the saved reviews; a lost push here is regenerated by the next run.
          node ../src/cli.ts ledger --save . > /dev/null || true
          git add -A
          if ! git diff --cached --quiet; then git commit -qm "rsrobo: ledger" && { push_retry || true; }; fi
        env:
          REPO: ${{ inputs.repo }}
          PR: ${{ inputs.pr }}
          TASK: ${{ inputs.task }}
      # The artifact is a courier, not an archive: once pushed, it goes.
      - if: steps.changes.outcome == 'success'
        run: |
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -q '.artifacts[]|select(.name=="notes-changes")|.id' |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
        env:
          GH_TOKEN: ${{ github.token }}
  # Writes the review's lessons into the kb. One writer at a time across all runs, queued, never cancelled.
  lessons:
    needs: review
    if: inputs.task == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    concurrency:
      group: kb-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: review-json
          path: review
      - name: install rkb
        run: |
          gh release download -R rslib/rkb -p 'rkb-linux-x86_64-*.tar.gz' -O rkb.tar.gz
          tar -xzf rkb.tar.gz && sudo install -m 755 rkb /usr/local/bin/rkb && rkb --version
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: |
          git config --global user.name rsrobo
          git config --global user.email rsrobo@users.noreply.github.com
          git clone -q "https://x-access-token:${USER_TOKEN}@github.com/rayandrew/kb.git" kb-write
          f=$(find review -name review.json | head -1)
          [ -n "$f" ] && node src/cli.ts lessons "$f" --kb-write "$PWD/kb-write" --post || echo "no review.json"
        env:
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
          GH_TOKEN: ${{ secrets.USER_TOKEN }}
          RKB_AUTO_CONFIRM: continue
      - if: always()
        run: |
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -q '.artifacts[]|select(.name=="review-json")|.id' |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
        env:
          GH_TOKEN: ${{ github.token }}
