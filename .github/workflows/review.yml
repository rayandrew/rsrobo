name: review
on:
  workflow_dispatch:
    inputs:
      repo: { description: "owner/name", required: true }
      pr: { description: "PR number", required: true }
      post: { description: "pending | review | inbox | comment", default: "pending" }
      model: { description: "model alias", default: "sonnet" }
      budget: { description: "USD cap", default: "3" }
      focus: { description: "focus areas", default: "" }
      effort: { description: "low | medium | high", default: "high" }
concurrency:
  group: review-${{ inputs.repo }}-${{ inputs.pr }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: rayandrew/rsrobo-notes
          token: ${{ secrets.USER_TOKEN }}
          ref: trunk
          path: notes
      - uses: actions/setup-node@v6
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm i -g @anthropic-ai/claude-code
      - run: node src/cli.ts review "$REPO#$PR" --post "$POST" --model "$MODEL" --budget "$BUDGET" --effort "$EFFORT" ${FOCUS:+--focus "$FOCUS"}
        env:
          REPO: ${{ inputs.repo }}
          PR: ${{ inputs.pr }}
          POST: ${{ inputs.post }}
          MODEL: ${{ inputs.model }}
          BUDGET: ${{ inputs.budget }}
          FOCUS: ${{ inputs.focus }}
          EFFORT: ${{ inputs.effort }}
          GH_TOKEN: ${{ secrets.USER_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RSROBO_NOTES_DIR: ${{ github.workspace }}/notes
      - if: always()
        working-directory: notes
        run: |
          git config user.name rsrobo
          git config user.email rsrobo@users.noreply.github.com
          git add reviews
          if ! git diff --cached --quiet; then git commit -qm "review: $REPO#$PR" && git push -q; fi
        env:
          REPO: ${{ inputs.repo }}
          PR: ${{ inputs.pr }}
      - if: failure()
        run: |
          gh issue create -R "$INBOX_REPO" -l rsrobo -t "rsrobo: review failed for $REPO#$PR" \
            -b "Run: $RUN_URL"
        env:
          REPO: ${{ inputs.repo }}
          PR: ${{ inputs.pr }}
          INBOX_REPO: rayandrew/rsrobo-notes
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.USER_TOKEN }}
